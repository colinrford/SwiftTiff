name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build for iOS
        run: xcodebuild build -scheme SwiftTiff -destination 'generic/platform=iOS' -quiet
